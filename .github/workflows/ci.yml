# Stratum WebUI CI (ROADMAP v0.4b)
#
# Layered because the Stratum engine is NOT in this repo (bin/*.exe is
# gitignored — it ships as an SDK release):
#   syntax    — always runs, no engine needed
#   tests     — full smoke suite (check count evolves with tests/test_smoke.py;
#               never hardcode it here — iter 15 found "47-check" stale at 57),
#               only when the SDK download URL secret is configured
#               (empty on forks → job skipped, not red)
#   installer — PyInstaller + Inno Setup + silent install/uninstall verify,
#               same secret gate, needs the tests job green
name: ci
on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: python syntax + import smoke (no engine)
        # compile() only catches SyntaxError; importing server.py also
        # exercises module-level ordering (probe fallback path, no engine)
        shell: pwsh
        run: |
          python -m py_compile server.py
          python -c "import server; assert server.BINARY is None; print('import smoke ok')"
      - name: UI JS syntax (inline + split modules)
        shell: pwsh
        run: |
          python -c "s=open('index.html',encoding='utf-8').read(); a=s.index('<script>')+9; b=s.rindex('</'+'script>'); open('ui_extract.js','w',encoding='utf-8').write(s[a:b])"
          node --check ui_extract.js
          node --check report.js
          node --check stl-preview.js

  tests:
    if: ${{ secrets.STRATUM_SDK_URL != '' }}
    runs-on: windows-latest
    env:
      STRATUM_BIN: ${{ github.workspace }}\bin\stratum.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: fetch Stratum SDK
        shell: pwsh
        run: |
          curl -L --fail -o sdk.zip "$env:STRATUM_SDK_URL"
          Expand-Archive sdk.zip sdk
          $exe = Get-ChildItem sdk -Recurse -Filter stratum.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "SDK zip contains no stratum.exe"; exit 1 }
          New-Item -ItemType Directory -Force bin | Out-Null
          # whole sibling dir: stratum_shared.dll may be required next to the exe
          Copy-Item ($exe.Directory.FullName + "\*") bin -Force
          Get-ChildItem bin
      - name: smoke suite
        shell: pwsh
        run: |
          if (-not (Test-Path bin\stratum.exe)) { Write-Error "engine missing before suite"; exit 1 }
          python tests\test_smoke.py

  installer:
    if: ${{ secrets.STRATUM_SDK_URL != '' }}
    needs: tests
    runs-on: windows-latest
    env:
      STRATUM_BIN: ${{ github.workspace }}\bin\stratum.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Inno Setup 6 (build.ps1 degrades silently without it — CI must not)
        shell: pwsh
        run: choco install -y innosetup
      - name: fetch Stratum SDK
        shell: pwsh
        run: |
          curl -L --fail -o sdk.zip "$env:STRATUM_SDK_URL"
          Expand-Archive sdk.zip sdk
          $exe = Get-ChildItem sdk -Recurse -Filter stratum.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "SDK zip contains no stratum.exe"; exit 1 }
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item ($exe.Directory.FullName + "\*") bin -Force
      - name: build (portable + installer)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1
      - name: verify installer (silent install/smoke/uninstall)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\verify-installer.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer
          path: dist/installer/
          if-no-files-found: warn
